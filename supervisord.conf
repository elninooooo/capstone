[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:hardhat]
command=npx hardhat node --port 5145
directory=/app/blockchain
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/hardhat.log
stderr_logfile=/var/log/supervisor/hardhat-err.log
priority=10
startsecs=5

[program:flask]
command=/app/backend/venv/bin/python3 app.py
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/flask.log
stderr_logfile=/var/log/supervisor/flask-err.log
priority=20
startsecs=3

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-err.log
priority=30
startsecs=2
